#
# Component:       repo
# Module:          .pre-commit-config.yaml
# Owning Team:     Platform Enablement Guild (PEG)
# Classification:  INTERNAL
# Purpose:         Git hooks run before every commit (file hygiene, YAML,
#                  shell, Python, Dockerfile and workflow linting) and on every commit message
#                  (Conventional Commits with the mandatory Step trailer).
#                  Also executed by `make lint-repo` and by CI (P0.6).
# Related Docs:    CLAUDE.md (sections 6.3, 7.1), ADR-0005, ADR-0010,
#                  CONTRIBUTING.md
#
# Setup:   brew install pre-commit && pre-commit install --install-hooks
# Run all: pre-commit run --all-files   (or: make lint-repo)
# Update:  pre-commit autoupdate

minimum_pre_commit_version: "3.0.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # --- File hygiene and line endings ----------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: mixed-line-ending
        name: line endings are LF
        args: [--fix=lf]
      - id: end-of-file-fixer
        exclude: \.(svg|typ)$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: \.(cob|cbl)$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        # Header templates carry a shebang for the file they start, not their own.
        exclude: ^templates/headers/
      - id: check-yaml
        args: [--allow-multiple-documents]
        # mkdocs.yml uses the !!python/name tag of pymdownx (ADR-0010), which
        # a safe YAML loader rejects; yamllint still checks its syntax.
        exclude: ^mkdocs\.yml$
      - id: check-json
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # --- YAML ------------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # --- Shell -----------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [--severity=style, --external-sources]

  # --- Python (repository scripts) ------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check, --diff]

  # --- Dockerfile -----------------------------------------------------------
  # hadolint runs from its pinned Docker Hub image so that no host install is
  # required; it therefore needs a running Docker daemon. (The upstream
  # `hadolint-docker` hook pulls `ghcr.io/...:latest`, which is unpinned and
  # was not reachable from this network; see ADR-0005.)
  - repo: local
    hooks:
      - id: hadolint
        name: hadolint (Dockerfile)
        language: docker_image
        entry: hadolint/hadolint:v2.15.1 hadolint
        types: [dockerfile]
        # Templates hold __PLACEHOLDER__ images; rendered Dockerfiles are checked.
        exclude: \.tmpl$

  # --- GitHub Actions workflows ----------------------------------------------
  # actionlint (with its bundled shellcheck for `run:` blocks) from its pinned
  # Docker Hub image, for the same reasons as hadolint above (ADR-0006).
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint (GitHub Actions)
        language: docker_image
        entry: rhysd/actionlint:1.7.12
        files: ^\.github/workflows/.+\.ya?ml$

  # --- File header templates ------------------------------------------------
  # templates/headers/*.tmpl are generated from header.txt and styles.psv;
  # this hook fails when they are edited by hand or not regenerated (ADR-0007).
  - repo: local
    hooks:
      - id: file-header-templates
        name: file header templates in sync
        language: system
        entry: scripts/file-header.sh check
        files: ^(templates/headers/|scripts/file-header\.sh$)
        pass_filenames: false

  # --- Documentation check --------------------------------------------------
  # File header and documented top-level definitions of every staged file
  # (scripts/doc-check.sh, ADR-0009); exemptions are in .doc-check-ignore.
  - repo: local
    hooks:
      - id: doc-check
        name: doc-check (file headers, documented definitions)
        language: system
        entry: scripts/doc-check.sh --quiet
        types: [file]

  # --- Commit messages -------------------------------------------------------
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
