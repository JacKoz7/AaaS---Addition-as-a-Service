# Component:       repo
# Module:          compose/services.yml
# Owning Team:     Platform Enablement Guild (PEG)
# Classification:  INTERNAL
# Purpose:         Profile `services`: the 35 AaaS microservices and their
#                  databases. `scripts/new-service.sh` (P0.4) appends one
#                  service and one database block per scaffolded service.
# Related Docs:    CLAUDE.md (section 2, service catalog; section 6.2), ADR-0003

# Profile: services
# Every service block follows the same shape (generated by
# scripts/new-service.sh from templates/service/, see ADR-0004):
#   build, image, profiles: [services], networks: [services, data],
#   mem_limit, cpus, healthcheck, depends_on with condition: service_healthy,
#   and a volume named <service>-data for its database.
#
# scripts/new-service.sh inserts service blocks above the AAAS:VOLUMES marker
# and volume entries at the end of the file. Keep the marker in place.
services:
  # --- gateway (traefik, PEG) ---------------------------------
  # The only entry point (CLAUDE.md 4.1, ADR-0012). Traefik with file-based
  # routes and the local `edge` plugin. No database until the Redis provider
  # of P5.4 (route table); the Redis container is added by that step.
  gateway:
    build:
      # Relative to compose/, the directory of the included file.
      context: ../services/gateway
      dockerfile: Dockerfile
      target: runtime
    image: aaas/gateway:dev
    profiles: [services]
    # `public` for the published port, `services` to reach the upstreams.
    networks: [public, services]
    ports:
      # Bound to the loopback interface until public access (Phase 12).
      - "127.0.0.1:80:8000"
    environment:
      AAAS_SERVICE: gateway
      AAAS_ENV: ${AAAS_ENV:-local}
      AAAS_BOOTSTRAP: ${AAAS_BOOTSTRAP:-env}
      # Upstreams of the routes in services/gateway/config/dynamic/routes.yml;
      # the values below are also the defaults built into the image.
      AAAS_UPSTREAM_EXPRESSION_ASSEMBLER: http://expression-assembler:8080
      # TEMPORARY(P3.3): task status is served by the ledger until the
      # saga-orchestrator takes over.
      AAAS_UPSTREAM_TASKS: http://ledger:8080
      AAAS_UPSTREAM_FRONTEND: http://frontend-shell:8080
    # Compiled language (Go): default limit for compiled services
    # (CLAUDE.md 6.2). Measured usage: services/gateway/docs/CAPACITY.md.
    mem_limit: 64m
    cpus: 0.5
    # Traefik finishes requests in flight for 8 s (config/traefik.yml).
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 10s
# AAAS:VOLUMES
volumes: {}
