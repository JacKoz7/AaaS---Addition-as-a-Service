# Component:       repo
# Module:          compose/services.yml
# Owning Team:     Platform Enablement Guild (PEG)
# Classification:  INTERNAL
# Purpose:         Profile `services`: the 35 AaaS microservices and their
#                  databases. `scripts/new-service.sh` (P0.4) appends one
#                  service and one database block per scaffolded service.
# Related Docs:    CLAUDE.md (section 2, service catalog; section 6.2), ADR-0003

# Profile: services
# Every service block follows the same shape (generated by
# scripts/new-service.sh from templates/service/, see ADR-0004):
#   build, image, profiles: [services], networks: [services, data],
#   mem_limit, cpus, healthcheck, depends_on with condition: service_healthy,
#   and a volume named <service>-data for its database.
#
# scripts/new-service.sh inserts service blocks above the AAAS:VOLUMES marker
# and volume entries at the end of the file. Keep the marker in place.
services:
  # --- gateway (traefik, PEG) ---------------------------------
  # The only entry point (CLAUDE.md 4.1, ADR-0012). Traefik with file-based
  # routes and the local `edge` plugin. No database until the Redis provider
  # of P5.4 (route table); the Redis container is added by that step.
  gateway:
    build:
      # Relative to compose/, the directory of the included file.
      context: ../services/gateway
      dockerfile: Dockerfile
      target: runtime
    image: aaas/gateway:dev
    profiles: [services]
    # `public` for the published port, `services` to reach the upstreams.
    networks: [public, services]
    ports:
      # Bound to the loopback interface until public access (Phase 12).
      - "127.0.0.1:80:8000"
    environment:
      AAAS_SERVICE: gateway
      AAAS_ENV: ${AAAS_ENV:-local}
      AAAS_BOOTSTRAP: ${AAAS_BOOTSTRAP:-env}
      # Upstreams of the routes in services/gateway/config/dynamic/routes.yml;
      # the values below are also the defaults built into the image.
      AAAS_UPSTREAM_EXPRESSION_ASSEMBLER: http://expression-assembler:8080
      # TEMPORARY(P3.3): task status is served by the ledger until the
      # saga-orchestrator takes over.
      AAAS_UPSTREAM_TASKS: http://ledger:8080
      AAAS_UPSTREAM_FRONTEND: http://frontend-shell:8080
    # Compiled language (Go): default limit for compiled services
    # (CLAUDE.md 6.2). Measured usage: services/gateway/docs/CAPACITY.md.
    mem_limit: 64m
    cpus: 0.5
    # Traefik finishes requests in flight for 8 s (config/traefik.yml).
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 10s
  # --- expression-assembler (csharp, CXT) ---------------------------------
  # Turns key presses into an expression and starts a task (CLAUDE.md 3,
  # step 2; ADR-0014). Behind the gateway at /api/v1/keys.
  expression-assembler:
    build:
      # Relative to compose/, the directory of the included file.
      context: ../services/expression-assembler
      dockerfile: Dockerfile
      target: runtime
    image: aaas/expression-assembler:dev
    profiles: [services]
    # `services` for the gateway and Redpanda, `data` for its own database.
    networks: [services, data]
    environment:
      AAAS_SERVICE: expression-assembler
      AAAS_ENV: ${AAAS_ENV:-local}
      AAAS_BOOTSTRAP: ${AAAS_BOOTSTRAP:-env}
      AAAS_KAFKA_BROKERS: redpanda:9092
      AAAS_DB_URL: http://expression-assembler-db:8000
      AAAS_DB_USER: expression_assembler
      EXPRESSION_ASSEMBLER_DB_PASSWORD: ${EXPRESSION_ASSEMBLER_DB_PASSWORD:-change-me}
    # Deviation from the 64 MB default for compiled languages (CLAUDE.md 6.2):
    # .NET compiles to IL and runs on a JIT runtime with a garbage collector,
    # plus the native librdkafka client; the interpreted-language default of
    # 128 MB applies. The GC heap is capped at 70% of the limit
    # (DOTNET_GCHeapHardLimitPercent in the Dockerfile). Measured usage:
    # services/expression-assembler/docs/CAPACITY.md.
    mem_limit: 128m
    cpus: 0.5
    # The host stops within 8 s (HostOptions.ShutdownTimeout).
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 30s
    depends_on:
      expression-assembler-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
  expression-assembler-db:
    image: surrealdb/surrealdb:v3.3.4
    profiles: [services]
    networks: [data]
    command: ["start", "--log", "info", "surrealkv:/home/nonroot/db"]
    environment:
      # Root-level user of this dedicated instance (moves to OpenBao in P5.3).
      SURREAL_USER: expression_assembler
      SURREAL_PASS: ${EXPRESSION_ASSEMBLER_DB_PASSWORD:-change-me}
      SURREAL_NO_BANNER: "true"
      # SurrealKV defaults to a 256 MiB memtable and a 3 GiB block cache;
      # bounded so that the store fits the 256 MB database limit.
      SURREAL_SURREALKV_MAX_MEMTABLE_SIZE: "16777216"
      SURREAL_SURREALKV_BLOCK_CACHE_CAPACITY: "16777216"
    volumes:
      # The image runs as `nonroot` (UID 65532); mounting the volume on its
      # home directory gives the new volume that owner.
      - expression-assembler-data:/home/nonroot
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 10s
      timeout: 2s
      retries: 10
      start_period: 10s
  # --- parser (ocaml, AEC) ---------------------------------
  # Turns the submitted expression into an AST and requests the addition
  # (CLAUDE.md 3, step 4; ADR-0015). Event-driven only: no route in the
  # gateway, no published port.
  parser:
    build:
      # Relative to compose/, the directory of the included file.
      context: ../services/parser
      dockerfile: Dockerfile
      target: runtime
    image: aaas/parser:dev
    profiles: [services]
    # `services` only: Redpanda is there, and the database (SQLite) is
    # embedded in the process, so the service needs no `data` network.
    networks: [services]
    environment:
      AAAS_SERVICE: parser
      AAAS_ENV: ${AAAS_ENV:-local}
      AAAS_BOOTSTRAP: ${AAAS_BOOTSTRAP:-env}
      AAAS_KAFKA_BROKERS: redpanda:9092
      AAAS_CONSUMER_GROUP: parser
      AAAS_DB_PATH: /data/parser.db
    # Compiled language (OCaml, native code): default limit for compiled
    # services (CLAUDE.md 6.2). Measured usage: services/parser/docs/CAPACITY.md.
    mem_limit: 64m
    cpus: 0.5
    # The process stops within 9 s (watchdog in src/main/main.ml).
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
    # SQLite is embedded in the service process; its files live in this
    # volume, owned by the image's non-root user (UID 10001).
    volumes:
      - parser-data:/data
  # --- successor (haskell, AEC) ---------------------------------
  # Computes n + 1 for the Peano loop (CLAUDE.md 3, step 7; ADR-0016); called
  # by the ledger (P1.7) and later by the saga. No gateway route.
  successor:
    build:
      # Relative to compose/, the directory of the included file.
      context: ../services/successor
      dockerfile: Dockerfile
      target: runtime
    image: aaas/successor:dev
    profiles: [services]
    # `services` for its callers and Redpanda, `data` for its own database.
    networks: [services, data]
    environment:
      AAAS_SERVICE: successor
      AAAS_ENV: ${AAAS_ENV:-local}
      AAAS_BOOTSTRAP: ${AAAS_BOOTSTRAP:-env}
      AAAS_KAFKA_BROKERS: redpanda:9092
      AAAS_DB_URL: http://successor-db:5984
      AAAS_DB_USER: successor
      SUCCESSOR_DB_PASSWORD: ${SUCCESSOR_DB_PASSWORD:-change-me}
    # Compiled language (GHC native code): default limit for compiled
    # services (CLAUDE.md 6.2); the GHC heap is capped at 40 MB (-M40m in
    # successor.cabal). Measured usage: services/successor/docs/CAPACITY.md.
    mem_limit: 64m
    cpus: 0.5
    # Requests in flight get 8 s; a watchdog exits after 9 s.
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      successor-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
  successor-db:
    # CouchDB 3.5.1 with the AaaS configuration copied in (single node,
    # n = 1); see services/successor/couchdb/Dockerfile.
    build:
      context: ../services/successor/couchdb
      dockerfile: Dockerfile
    image: aaas/successor-db:dev
    profiles: [services]
    networks: [data]
    environment:
      # Admin of this dedicated instance (moves to OpenBao in P5.3).
      COUCHDB_USER: successor
      COUCHDB_PASSWORD: ${SUCCESSOR_DB_PASSWORD:-change-me}
    volumes:
      - successor-data:/opt/couchdb/data
    # Databases: default limit (CLAUDE.md 6.2); measured in CAPACITY.md.
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:5984/_up"]
      interval: 10s
      timeout: 2s
      retries: 10
      start_period: 20s
  # --- ledger (nim, TIO) ---------------------------------
  # Hash-chained record of every result (CLAUDE.md 3, step 10, ADR-0017).
  # TEMPORARY(P3.3): also counts additions by calling successor b times and
  # answers GET /api/v1/tasks/{taskId} (the gateway's `tasks` upstream).
  ledger:
    build:
      # Relative to compose/, the directory of the included file.
      context: ../services/ledger
      dockerfile: Dockerfile
      target: runtime
    image: aaas/ledger:dev
    profiles: [services]
    # `services` for the gateway, successor and Redpanda, `data` for its own
    # database.
    networks: [services, data]
    environment:
      AAAS_SERVICE: ledger
      AAAS_ENV: ${AAAS_ENV:-local}
      AAAS_BOOTSTRAP: ${AAAS_BOOTSTRAP:-env}
      AAAS_KAFKA_BROKERS: redpanda:9092
      AAAS_DB_URL: http://ledger-db:8080
      AAAS_DB_USER: ledger
      AAAS_SUCCESSOR_URL: http://successor:8080
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-change-me}
    # Compiled language (Nim, ORC memory management): default limit for
    # compiled services (CLAUDE.md 6.2). Measured usage:
    # services/ledger/docs/CAPACITY.md.
    mem_limit: 64m
    cpus: 0.5
    # Counting tasks checkpoint and Kafka is closed within 8 s.
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      ledger-db-init:
        condition: service_completed_successfully
      successor:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
  ledger-db:
    # immudb: tamper-evident database that keeps every version of every row.
    # The ledger uses its SQL engine through the REST API of the web server
    # (port 8080 of the container, ADR-0017); the gRPC port 3322 serves only
    # the health check (immuadmin status). Multi-arch (amd64, arm64).
    image: codenotary/immudb:1.11.2
    profiles: [services]
    networks: [data]
    environment:
      # Superadmin password, applied when the data directory is created;
      # only ledger-db-init uses it.
      IMMUDB_ADMIN_PASSWORD: ${LEDGER_DB_ADMIN_PASSWORD:-change-me-admin}
      # The image defaults to dev mode; without it every request needs a
      # session.
      IMMUDB_DEVMODE: "false"
      # The PostgreSQL wire protocol is not used.
      IMMUDB_PGSQL_SERVER: "false"
    volumes:
      - ledger-data:/var/lib/immudb
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/usr/local/bin/immuadmin", "status"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
  ledger-db-init:
    # One-shot provisioning: the ledger database and its read-write user,
    # created with the superadmin credentials, which the service never sees
    # (services/ledger/immudb/provision.sh). Idempotent; exits 0.
    image: curlimages/curl:8.17.0
    profiles: [services]
    networks: [data]
    entrypoint: ["/bin/sh", "/provision.sh"]
    environment:
      IMMUDB_URL: http://ledger-db:8080
      IMMUDB_ADMIN_PASSWORD: ${LEDGER_DB_ADMIN_PASSWORD:-change-me-admin}
      LEDGER_DB_USER: ledger
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-change-me}
    volumes:
      - ../services/ledger/immudb/provision.sh:/provision.sh:ro
    mem_limit: 32m
    cpus: 0.25
    restart: "no"
    depends_on:
      ledger-db:
        condition: service_healthy
# AAAS:VOLUMES
volumes:
  expression-assembler-data: {}
  parser-data: {}
  successor-data: {}
  ledger-data: {}
