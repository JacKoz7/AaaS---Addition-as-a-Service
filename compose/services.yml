# Component:       repo
# Module:          compose/services.yml
# Owning Team:     Platform Enablement Guild (PEG)
# Classification:  INTERNAL
# Purpose:         Profile `services`: the 35 AaaS microservices and their
#                  databases. `scripts/new-service.sh` (P0.4) appends one
#                  service and one database block per scaffolded service.
# Related Docs:    CLAUDE.md (section 2, service catalog; section 6.2), ADR-0003

# Profile: services
# Every service block follows the same shape (generated by
# scripts/new-service.sh from templates/service/, see ADR-0004):
#   build, image, profiles: [services], networks: [services, data],
#   mem_limit, cpus, healthcheck, depends_on with condition: service_healthy,
#   and a volume named <service>-data for its database.
#
# scripts/new-service.sh inserts service blocks above the AAAS:VOLUMES marker
# and volume entries at the end of the file. Keep the marker in place.
services:
  # --- gateway (traefik, PEG) ---------------------------------
  # The only entry point (CLAUDE.md 4.1, ADR-0012). Traefik with file-based
  # routes and the local `edge` plugin. No database until the Redis provider
  # of P5.4 (route table); the Redis container is added by that step.
  gateway:
    build:
      # Relative to compose/, the directory of the included file.
      context: ../services/gateway
      dockerfile: Dockerfile
      target: runtime
    image: aaas/gateway:dev
    profiles: [services]
    # `public` for the published port, `services` to reach the upstreams.
    networks: [public, services]
    ports:
      # Bound to the loopback interface until public access (Phase 12).
      - "127.0.0.1:80:8000"
    environment:
      AAAS_SERVICE: gateway
      AAAS_ENV: ${AAAS_ENV:-local}
      AAAS_BOOTSTRAP: ${AAAS_BOOTSTRAP:-env}
      # Upstreams of the routes in services/gateway/config/dynamic/routes.yml;
      # the values below are also the defaults built into the image.
      AAAS_UPSTREAM_EXPRESSION_ASSEMBLER: http://expression-assembler:8080
      # TEMPORARY(P3.3): task status is served by the ledger until the
      # saga-orchestrator takes over.
      AAAS_UPSTREAM_TASKS: http://ledger:8080
      AAAS_UPSTREAM_FRONTEND: http://frontend-shell:8080
    # Compiled language (Go): default limit for compiled services
    # (CLAUDE.md 6.2). Measured usage: services/gateway/docs/CAPACITY.md.
    mem_limit: 64m
    cpus: 0.5
    # Traefik finishes requests in flight for 8 s (config/traefik.yml).
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 10s
  # --- expression-assembler (csharp, CXT) ---------------------------------
  # Turns key presses into an expression and starts a task (CLAUDE.md 3,
  # step 2; ADR-0014). Behind the gateway at /api/v1/keys.
  expression-assembler:
    build:
      # Relative to compose/, the directory of the included file.
      context: ../services/expression-assembler
      dockerfile: Dockerfile
      target: runtime
    image: aaas/expression-assembler:dev
    profiles: [services]
    # `services` for the gateway and Redpanda, `data` for its own database.
    networks: [services, data]
    environment:
      AAAS_SERVICE: expression-assembler
      AAAS_ENV: ${AAAS_ENV:-local}
      AAAS_BOOTSTRAP: ${AAAS_BOOTSTRAP:-env}
      AAAS_KAFKA_BROKERS: redpanda:9092
      AAAS_DB_URL: http://expression-assembler-db:8000
      AAAS_DB_USER: expression_assembler
      EXPRESSION_ASSEMBLER_DB_PASSWORD: ${EXPRESSION_ASSEMBLER_DB_PASSWORD:-change-me}
    # Deviation from the 64 MB default for compiled languages (CLAUDE.md 6.2):
    # .NET compiles to IL and runs on a JIT runtime with a garbage collector,
    # plus the native librdkafka client; the interpreted-language default of
    # 128 MB applies. The GC heap is capped at 70% of the limit
    # (DOTNET_GCHeapHardLimitPercent in the Dockerfile). Measured usage:
    # services/expression-assembler/docs/CAPACITY.md.
    mem_limit: 128m
    cpus: 0.5
    # The host stops within 8 s (HostOptions.ShutdownTimeout).
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 30s
    depends_on:
      expression-assembler-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
  expression-assembler-db:
    image: surrealdb/surrealdb:v3.3.4
    profiles: [services]
    networks: [data]
    command: ["start", "--log", "info", "surrealkv:/home/nonroot/db"]
    environment:
      # Root-level user of this dedicated instance (moves to OpenBao in P5.3).
      SURREAL_USER: expression_assembler
      SURREAL_PASS: ${EXPRESSION_ASSEMBLER_DB_PASSWORD:-change-me}
      SURREAL_NO_BANNER: "true"
      # SurrealKV defaults to a 256 MiB memtable and a 3 GiB block cache;
      # bounded so that the store fits the 256 MB database limit.
      SURREAL_SURREALKV_MAX_MEMTABLE_SIZE: "16777216"
      SURREAL_SURREALKV_BLOCK_CACHE_CAPACITY: "16777216"
    volumes:
      # The image runs as `nonroot` (UID 65532); mounting the volume on its
      # home directory gives the new volume that owner.
      - expression-assembler-data:/home/nonroot
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 10s
      timeout: 2s
      retries: 10
      start_period: 10s
# AAAS:VOLUMES
volumes:
  expression-assembler-data: {}
