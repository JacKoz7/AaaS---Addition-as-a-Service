# Component:       frontend-shell
# Module:          nginx/default.conf
# Owning Team:     Customer Experience Tribe (CXT)
# Classification:  INTERNAL
# Purpose:         nginx server of the temporary page: static files, security
#                  headers, JSON access log, /health and /metrics for the
#                  container only.
# Related Docs:    frontend/shell/README.md, CLAUDE.md 6.1 and 6.2, ADR-0018

# One JSON object per request with the fields of CLAUDE.md 6.1. nginx writes
# its own error log as plain text to stderr.
log_format aaas escape=json
  '{"ts":"$time_iso8601","level":"info","service":"frontend-shell",'
  '"msg":"$request_method $uri $status","taskId":null,"traceId":null,'
  '"spanId":null,"status":$status,"bytes":$body_bytes_sent,'
  '"ms":$request_time}';

# Requests that came through the gateway carry X-Forwarded-For; /health and
# /metrics answer only the container's own health check and Prometheus.
map $http_x_forwarded_for $from_gateway {
  ""      0;
  default 1;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout aaas;

  # Same-origin page: scripts, styles and API calls only from the gateway's
  # origin; no frames, no forms, no inline code.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  # A changed page is used at the next load (no build step adds hashes).
  add_header Cache-Control "no-cache" always;

  location = /health {
    if ($from_gateway) {
      return 404;
    }
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","checks":{}}';
  }

  location = /metrics {
    if ($from_gateway) {
      return 404;
    }
    access_log off;
    default_type "text/plain; version=0.0.4";
    return 200 "# HELP frontend_shell_up Whether the nginx of the temporary page is serving.\n# TYPE frontend_shell_up gauge\nfrontend_shell_up 1\n";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
