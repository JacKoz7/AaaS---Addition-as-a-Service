# Component:       expression-assembler
# Module:          docfx/filter.yml
# Owning Team:     Customer Experience Tribe (CXT)
# Classification:  INTERNAL
# Purpose:         DocFX API filter: excludes code generated by the .NET
#                  source generators (regular expressions, logging), which
#                  is not written in this repository and has no AaaS
#                  documentation.
# Related Docs:    docfx.json, services/expression-assembler/Dockerfile

apiRules:
  - exclude:
      uidRegex: ^System\.Text\.RegularExpressions\.Generated
      type: Namespace
  - exclude:
      uidRegex: ^Microsoft\.Extensions\.Logging\.Generated
      type: Namespace
