; Component:       successor
; Module:          couchdb/10-aaas.ini
; Owning Team:     Arithmetic Excellence Center (AEC)
; Classification:  INTERNAL
; Purpose:         Configuration of the successor's CouchDB instance (copied
;                  into /opt/couchdb/etc/local.d/ by couchdb/Dockerfile):
;                  single node, one replica per shard, quiet log.
; Related Docs:    services/successor/README.md, ADR-0016

[couchdb]
; One node: CouchDB creates its system databases itself and skips the
; cluster setup wizard.
single_node = true

[cluster]
; One node holds every shard: databases get one replica (n = 1) and two
; shards (q = 2) instead of the defaults n = 3 and q = 2 meant for clusters.
n = 1
q = 2

[log]
; Requests are not logged one by one; 100 000 calls per addition would
; flood the container log.
level = warning
